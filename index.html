<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Calculator app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css">
</head>
<body class="theme-1">
    <div class="main">
        <div class="calculator-header">
            <div class="calc-logo">
                <span>calc</span>
            </div>
            <div class="theme-changer-container">
                <span>THEME</span>
                <div class="theme-changer-with-numbers">
                    <span class="theme1-number">1</span>
                    <span class="theme2-number">2</span>
                    <span class="theme3-number">3</span>
                    <div class="theme-changer">
                        <div class="circle-changer"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="resault-container">
            <div class="resault">0</div>
        </div>
        <div class="calculator-btns">
            <div class="calculator-numbers">
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button id="del-btn">DEL</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="plus">+</button>
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="minus">-</button>
                <button class="points">.</button>
                <button class="number">0</button>
                <button class="divided">/</button>
                <button class="times">x</button>
            </div>
            <div class="calculator-actions">
                <button class="reset-action">RESET</button>
                <button class="equal-action">=</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
